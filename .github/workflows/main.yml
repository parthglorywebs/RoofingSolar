name: Send Test Email with Zoho Mail

on:
  push:
    branches: [dev]

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Send Email with Zoho Mail
        env:
          ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          ZOHO_APP_PASSWORD: ${{ secrets.ZOHO_APP_PASSWORD }}
          RECIPIENT_EMAIL: "parthglory2025@gmail.com"  # Or any recipient for testing
        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            let transporter = nodemailer.createTransport({
              host: 'smtp.zoho.com',   // Zoho SMTP server
              port: 587,              // Or 465 for SSL
              secure: false,          // true for 465, false for 587
              auth: {
                user: process.env.ZOHO_EMAIL,
                pass: process.env.ZOHO_APP_PASSWORD,
              },
              tls: {
                ciphers: 'SSLv3',
                rejectUnauthorized: false // Needed for some setups
              }
            });

            try {
              let info = await transporter.sendMail({
                from: \`"GitHub Actions Test" <\${process.env.ZOHO_EMAIL}>\`,
                to: process.env.RECIPIENT_EMAIL,
                subject: "Test Email from GitHub Actions (Zoho)",
                text: "This is a test email sent from GitHub Actions using Zoho Mail.",
                html: "<p>This is a <b>test</b> email sent from GitHub Actions using Zoho Mail.</p>",
              });

              console.log("✅ Email sent: %s", info.messageId);
              console.log("::set-output name=email_sent::true");
            } catch (error) {
              console.error("❌ Error sending email:", error);
              console.log("::set-output name=email_sent::false");
            }
          }

          main();
          EOF
        id: zoho_send

      - name: Print Success/Failure Message
        if: steps.zoho_send.outputs.email_sent == 'true'
        run: echo "✅ Email sent successfully!"

      - name: Print Failure Message
        if: steps.zoho_send.outputs.email_sent == 'false'
        run: echo "❌ Failed to send email!"