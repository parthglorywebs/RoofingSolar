name: Send Test Email via Gmail SMTP (Student/Testing - Limited Use)

on:
  push:
    branches: [dev]  # Trigger on pushes to the 'dev' branch

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Specific Node.js version for consistency

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Send Email with Gmail SMTP
        env:
          GMAIL_USER: ${{ secrets.MAILTRAP_USERNAME }} # Gmail address to send from
          GMAIL_PASS: ${{ secrets.MAILTRAP_PASSWORD }} # App Password for Gmail (Highly Recommended)
          RECIPIENT_EMAIL: parthglory2025@gmail.com # Email address to send to for testing
        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            let transporter = nodemailer.createTransport({
              host: "smtp.gmail.com",
              port: 465,  // Use 465 for secure SSL
              secure: true, // Use SSL
              auth: {
                user: process.env.MAILTRAP_USERNAME,
                pass: process.env.MAILTRAP_PASSWORD, // Use an App Password!
              },
            });

            let info = await transporter.sendMail({
              from: '"GitHub Actions Test" <${process.env.GMAIL_USER}>', // Sender address
              to: "${process.env.RECIPIENT_EMAIL}",  // Recipient address (from env)
              subject: "Gmail SMTP Test from GitHub Actions", // Subject line
              text: "This is a test email sent via Gmail SMTP from GitHub Actions.", // Plain text body
              html: "<h3>This is a test email sent via Gmail SMTP from GitHub Actions.</h3>", // HTML body
            });

            console.log("✅ Message sent: %s", info.messageId);
            //console.log("Preview URL: %s", nodemailer.getTestMessageUrl(info));

          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1); // Fail the workflow
          });
          EOF