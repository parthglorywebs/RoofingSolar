name: Build and Send APK

on:
  push:
    branches: [dev]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Specific Node.js version for consistency

      - name: Install Dependencies
        run: npm install nodemailer

      # Placeholder for building the APK.  Replace with your actual build steps.
      - name: Build APK
        id: build_apk_step  # Assign an ID for later use
        run: |
          echo "Building APK..."
          APK_OUTPUT_DIR="app/build/outputs/apk/debug"  # Define a variable for clarity
          mkdir -p "$APK_OUTPUT_DIR"
          touch "$APK_OUTPUT_DIR/app-debug.apk"  # Create a dummy apk for testing. REMOVE THIS when you have a real APK build process.
          echo "APK built at $APK_OUTPUT_DIR/app-debug.apk"
          echo "APK_PATH=$APK_OUTPUT_DIR/app-debug.apk" >> $GITHUB_OUTPUT # Pass path to subsequent steps

      # Step to upload the APK to a temporary location. Replace with your actual path
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.build_apk_step.outputs.APK_PATH }}

      - name: Make Artifacts Public
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            -f name=apk \
            -f visibility=public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Email with Brevo SMTP
        env:
          BREVO_HOST: "smtp-relay.brevo.com"
          BREVO_PORT: 587
          BREVO_USERNAME: "86daf4001@smtp-brevo.com"
          BREVO_PASSWORD: "9HUFhqYPs4xgNJAc"
          RECIPIENT_EMAIL: "parthglory2025@gmail.com"  # For testing
          SENDER_EMAIL: "parthm@glorywebsdev.com"  # Verified Sender in Brevo
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            const GITHUB_RUN_ID = process.env.GITHUB_RUN_ID;
            const REPO = process.env.GITHUB_REPOSITORY;
            const APK_LINK = \`https://github.com/\${REPO}/actions/runs/\${GITHUB_RUN_ID}/artifacts\`;

            let transporter = nodemailer.createTransport({
              host: process.env.BREVO_HOST,
              port: process.env.BREVO_PORT,
              secure: false,
              auth: {
                user: process.env.BREVO_USERNAME,
                pass: process.env.BREVO_PASSWORD,
              },
              tls: {
                ciphers: 'SSLv3',
                rejectUnauthorized: false
              }
            });

            let info = await transporter.sendMail({
              from: \`"GitHub Actions" <\${process.env.SENDER_EMAIL}>\`,
              to: process.env.RECIPIENT_EMAIL,
              subject: "Your APK is Ready!",
              text: \`Download your APK here: \${APK_LINK}\`,
              html: \`<p>Your APK is ready! Click below to download:</p><a href="\${APK_LINK}">\${APK_LINK}</a>\`,
            });

            console.log("✅ Email sent: %s", info.messageId);
          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1);
          });
          EOF