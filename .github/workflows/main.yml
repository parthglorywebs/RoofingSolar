name: Build and Send APK (Diawi)

on:
  push:
    branches: [dev]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Specific Node.js version for consistency

      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Build APK (Replace with your actual build steps)
        run: |
          # Example: If you use Gradle
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app-debug.apk # rename for easy reference

      - name: Upload APK to Diawi
        env:
          DIAWI_API_TOKEN: ${{ secrets.DIAWI_API_TOKEN }}
        run: |
          response=$(curl -F "file=@app-debug.apk" \
                       -F "token=$DIAWI_API_TOKEN" \
                       -F "installation=1" \
                       https://upload.diawi.com/ 2>&1) # Redirect stderr to stdout for error capture

          echo "Diawi Response: $response"

          DIAWI_LINK=$(echo "$response" | grep -oP '(?<="link":"\s*")[^"]+') # Extract the link from json
          if [[ -z "$DIAWI_LINK" ]]; then
            echo "❌ Failed to extract Diawi link.  Check the response from Diawi for errors."
            echo "$response"
            exit 1  # Fail the workflow
          else
            echo "✅ Diawi Link: $DIAWI_LINK"
            echo "DIAWI_LINK=$DIAWI_LINK" >> $GITHUB_ENV # Make it available as env var for subsequent steps
          fi

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Send Email with Brevo SMTP
        env:
          BREVO_HOST: "smtp-relay.brevo.com"
          BREVO_PORT: 587
          BREVO_USERNAME: "86daf4001@smtp-brevo.com"
          BREVO_PASSWORD: "9HUFhqYPs4xgNJAc"
          RECIPIENT_EMAIL: "parthm@glorywebsdev.com"  # For testing
          SENDER_EMAIL: "parthglory2025@gmail.com"  # Verified Sender in Brevo

        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            const DIAWI_LINK = process.env.DIAWI_LINK;

            let transporter = nodemailer.createTransport({
              host: process.env.BREVO_HOST,
              port: process.env.BREVO_PORT,
              secure: false,
              auth: {
                user: process.env.BREVO_USERNAME,
                pass: process.env.BREVO_PASSWORD,
              },
              tls: {
                ciphers: 'SSLv3',
                rejectUnauthorized: false
              }
            });

            let info = await transporter.sendMail({
              from: \`"GitHub Actions" <\${process.env.SENDER_EMAIL}>\`,
              to: process.env.RECIPIENT_EMAIL,
              subject: "Your APK is Ready!",
              text: \`Download your APK here: \${DIAWI_LINK}\`,
              html: \`<p>Your APK is ready! Click below to download:</p><a href="\${DIAWI_LINK}">Download APK</a>\`,
            });

            console.log("✅ Email sent: %s", info.messageId);
          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1);
          });
          EOF