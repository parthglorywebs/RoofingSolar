name: Build and Send APK

on:
  push:
    branches: [dev]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create Artifact (Example - replace with your actual build process)
        run: |
          mkdir -p artifacts
          echo "This is a dummy APK file" > artifacts/app.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: artifacts/app.apk

      - name: Notify Users (using GitHub Actions output)
        id: notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "apk_ready=true" >> $GITHUB_OUTPUT
          echo "artifact_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Send Workflow Conclusion Notification
        if: always()  # Run this step regardless of the previous steps' outcome
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}  # Use secret
          password: ${{ secrets.GMAIL_PASSWORD }}  # Use secret (App Password)
          subject: Workflow Build and Send APK job result!
          to: vivek@glorywebs.com
          from: ${{ secrets.GMAIL_USERNAME }}  # Use secret
          body: |
            Hello!
            Workflow ${{ github.workflow }} job result is ${{ job.status }}.

          html_body: |
              Hello!<br>
              Workflow <b>${{ github.workflow }}</b> job result is <b>${{ job.status }}</b>.