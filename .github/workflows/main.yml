name: Send Test Email with Mailjet

on:
  push:
    branches: [dev]  # Or any branch you want to trigger on

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Or your desired Node.js version

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Send Email with Mailjet
        env:
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          RECIPIENT_EMAIL: "parthglory2025@gmail.com"  # Replace with the recipient's email
          SENDER_EMAIL: "parthglory2025@gmail.com"  # Replace with your verified sender email in Mailjet
        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            let transporter = nodemailer.createTransport({
              host: 'in-v3.mailjet.com',  // Mailjet SMTP server
              port: 587,  // Or 465 (SSL)
              secure: false, // Use `true` for port 465, `false` for port 587
              auth: {
                user: process.env.MAILJET_API_KEY,
                pass: process.env.MAILJET_SECRET_KEY,
              },
            });

            try {
              let info = await transporter.sendMail({
                from: \`"GitHub Actions Test" <\${process.env.SENDER_EMAIL}>\`,
                to: process.env.RECIPIENT_EMAIL,
                subject: "Test Email from GitHub Actions",
                text: "This is a test email sent from a GitHub Actions workflow using Mailjet.",
                html: "<p>This is a <b>test</b> email sent from a GitHub Actions workflow using Mailjet.</p>",
              });

              console.log("✅ Email sent: %s", info.messageId);
              console.log("::set-output name=email_sent::true"); // Set output variable
            } catch (error) {
              console.error("❌ Error sending email:", error);
              console.log("::set-output name=email_sent::false"); // Set output variable
            }
          }

          main();
          EOF
        id: mailjet_send

      - name: Print Success/Failure Message
        if: steps.mailjet_send.outputs.email_sent == 'true'
        run: echo "✅ Email sent successfully!"

      - name: Print Failure Message
        if: steps.mailjet_send.outputs.email_sent == 'false'
        run: echo "❌ Failed to send email!"