name: Build and Send APK

on:
  push:
    branches: [dev]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Specific Node.js version for consistency

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Send Email with Mailbluster SMTP
        env:
          MAILBLUSTER_HOST: "smtp.mailbluster.com"  # Mailbluster SMTP Host
          MAILBLUSTER_PORT: 587 # Mailbluster SMTP Port
          MAILBLUSTER_USERNAME: "parthglory2025@gmail.com" # Replace with your Mailbluster username
          MAILBLUSTER_PASSWORD: "Glory@123" # Replace with your Mailbluster password
          RECIPIENT_EMAIL: "parthglory2025@gmail.com"  # For testing
          SENDER_EMAIL: "parthglory2025@gmail.com"  # Verified Sender in Mailbluster
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            const GITHUB_RUN_ID = process.env.GITHUB_RUN_ID;
            const REPO = process.env.GITHUB_REPOSITORY;
            const APK_LINK = \`https://github.com/\${REPO}/actions/runs/\${GITHUB_RUN_ID}/artifacts\`;

            let transporter = nodemailer.createTransport({
              host: process.env.MAILBLUSTER_HOST,
              port: process.env.MAILBLUSTER_PORT,
              secure: false,
              auth: {
                user: process.env.MAILBLUSTER_USERNAME,
                pass: process.env.MAILBLUSTER_PASSWORD,
              },
              tls: {
                ciphers: 'SSLv3', // Adjust cipher if needed by Mailbluster
                rejectUnauthorized: false  // Consider removing this in production if possible, but needed for some SMTP servers
              }
            });

            let info = await transporter.sendMail({
              from: \`"GitHub Actions" <\${process.env.SENDER_EMAIL}>\`,
              to: process.env.RECIPIENT_EMAIL,
              subject: "Your APK is Ready!",
              text: \`Download your APK here: \${APK_LINK}\`,
              html: \`<p>Your APK is ready! Click below to download:</p><a href="\${APK_LINK}">\${APK_LINK}</a>\`,
            });

            console.log("✅ Email sent: %s", info.messageId);
          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1);
          });
          EOF