name: Send Test Email via Gmail SMTP (Highly Discouraged)

on:
  push:
    branches: [dev]

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Send Email with Gmail SMTP
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}  # Your dedicated test Gmail address
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}  # Your Gmail password *or* App Password
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }} # The email address you want to send the email to (for testing)
        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            let transporter = nodemailer.createTransport({
              host: 'smtp.gmail.com',
              port: 465,  // or 587 for TLS (STARTTLS)
              secure: true, // true for 465, false for other ports
              auth: {
                user: process.env.GMAIL_USER,
                pass: process.env.GMAIL_PASS,  // Use App Password if 2FA is enabled!
              },
            });

            let info = await transporter.sendMail({
              from: process.env.GMAIL_USER,
              to: process.env.RECIPIENT_EMAIL,
              subject: "Test Email from GitHub Actions (Gmail SMTP - VERY Discouraged)",
              text: "This is a test email sent using Gmail SMTP (not recommended for production).",
              html: "<p>This is a test email sent using Gmail SMTP (<strong>not recommended</strong> for production).</p>",
            });

            console.log("Message sent: %s", info.messageId);
          }

          main().catch((err) => {
            console.error("Error sending email:", err);
            process.exit(1); // Fail the workflow
          });
          EOF