name: Send Test Email via Mailjet API (Node.js)

on:
  push:
    branches: [dev]  # Trigger on pushes to the 'dev' branch

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Specific Node.js version for consistency

      - name: Install Dependencies
        run: npm install node-mailjet

      - name: Send Email with Mailjet API
        env:
          MJ_APIKEY_PUBLIC: ${{ secrets.MAILJET_API_KEY }}
          MJ_APIKEY_PRIVATE: ${{ secrets.MAILJET_SECRET_KEY }}
        run: |
          node <<EOF
          const Mailjet = require('node-mailjet');

          const mailjet = Mailjet.apiConnect(
            process.env.MJ_APIKEY_PUBLIC,
            process.env.MJ_APIKEY_PRIVATE,
          );

          mailjet
            .post('send', { version: 'v3.1' })
            .request({
              Messages: [
                {
                  From: {
                    Email: "parthglory2025@gmail.com",  // **MUST BE VERIFIED IN MAILJET**
                    Name: "Parth Glory"
                  },
                  To: [
                    {
                      Email: "parthglory2025@gmail.com",
                      Name: "Parth Glory"
                    }
                  ],
                  Subject: "Greetings from Mailjet (Node.js)!",
                  TextPart: "Dear Parth Glory, welcome to Mailjet!",
                  HTMLPart: "<h3>Dear Parth Glory, welcome to Mailjet!</h3><br />",
                }
              ]
            })
            .then((result) => {
              console.log("✅ Email sent successfully!");
              console.log(JSON.stringify(result.body, null, 2));  // Log formatted response
            })
            .catch((err) => {
              console.error("❌ Error sending email:");
              console.error("Status Code:", err.statusCode);
              console.error("Complete Error:", err);  // Log full error
              process.exit(1);  // Fail the workflow if email sending fails
            });
          EOF
