name: Send Test Email via Mailjet API (Node.js)

on:
  push:
    branches: [dev]  # Trigger on pushes to the 'dev' branch (adjust as needed)

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'  # Use a specific Node.js version

      - name: Install Dependencies
        run: npm install node-mailjet  # Install the Mailjet Node.js library

      - name: Send Email with Mailjet API
        env:
          MJ_APIKEY_PUBLIC: ${{ secrets.MAILJET_API_KEY }}  # Your Mailjet API key
          MJ_APIKEY_PRIVATE: ${{ secrets.MAILJET_SECRET_KEY }}  # Your Mailjet Secret key
        run: |
          node <<EOF
          const Mailjet = require('node-mailjet');

          const mailjet = Mailjet.apiConnect(
            process.env.MJ_APIKEY_PUBLIC,
            process.env.MJ_APIKEY_PRIVATE,
          );

          const request = mailjet
            .post('send', { version: 'v3.1' })
            .request({
              Messages: [
                {
                  From: {
                    Email: "parthglory2025@gmail.com",  // Replace with your verified sender!
                    Name: "Parth Glory"
                  },
                  To: [
                    {
                      Email: "parthm@glorywebsdev.com",
                      Name: "Parth Glory"
                    }
                  ],
                  Subject: "Greetings from Mailjet (Node.js)!",
                  TextPart: "Dear Parth Glory, welcome to Mailjet!",
                  HTMLPart: "<h3>Dear Parth Glory, welcome to Mailjet!</h3><br />",
                }
              ]
            });

          request
            .then((result) => {
              console.log("Email sent successfully!");
              console.log(result.body);  // Log the response body
            })
            .catch((err) => {
              console.error("Error sending email:");
              console.error(err.statusCode); // Log the status code
              console.error(err);            //Log the complete error message
            });
          EOF