name: Build Debug APK and Send Email via Brevo

on:
  push:
    branches: [dev]  # Trigger on pushes to 'dev' branch

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      artifact_url: ${{ steps.get_artifact_url.outputs.artifact_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # Enable Java caching

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'  # Cache npm packages

      - name: Restore Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/*.kt', '**/*.java') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            gradle-

      - name: Install dependencies
        run: |
          npm install

      - name: Assemble Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace # Add --stacktrace for more verbose logging

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Get Artifact Download URL
        id: get_artifact_url
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # Use the default GITHUB_TOKEN, ensure it has read permissions
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const artifact = artifacts.data.artifacts.find(artifact => artifact.name === 'app-debug');

            if (!artifact) {
              console.log('No artifact found with name app-debug');
              core.setOutput('artifact_url', ''); // Return empty string instead of failing
              return;
            }

            // Construct the download URL for the artifact
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
            core.setOutput('artifact_url', url);

  send_email:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.artifact_url != ''

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install Nodemailer
        run: npm install nodemailer

      - name: Send Email with APK Link via Brevo SMTP
        env:
          BREVO_HOST: "smtp-relay.brevo.com"
          BREVO_PORT: 587
          BREVO_USERNAME: ${{ secrets.BREVO_USERNAME }}
          BREVO_PASSWORD: ${{ secrets.BREVO_PASSWORD }}
          RECIPIENT_EMAIL: "parthglory2025@gmail.com"
          SENDER_EMAIL: "parthglory2025@gmail.com"
          ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
        run: |
          node <<EOF
          const nodemailer = require('nodemailer');
          async function main() {
            let transporter = nodemailer.createTransport({
              host: process.env.BREVO_HOST,
              port: process.env.BREVO_PORT,
              secure: false,
              auth: {
                user: process.env.BREVO_USERNAME,
                pass: process.env.BREVO_PASSWORD,
              },
              tls: {
                ciphers:'SSLv3',
                rejectUnauthorized: false // Only for testing, remove for production
              }
            });

            let downloadLink = process.env.ARTIFACT_URL;
            
            let info = await transporter.sendMail({
              from: \`"GitHub Actions" <\${process.env.SENDER_EMAIL}>\`,
              to: process.env.RECIPIENT_EMAIL,
              subject: "✅ Debug APK Build Available",
              text: "A new Debug APK is available. Download here: " + downloadLink,
              html: \`
                <h3>🚀 New Debug APK Available</h3>
                <p>You can download the latest debug APK by clicking the link below:</p>
                <a href="\${downloadLink}" style="font-size:18px; font-weight:bold; color: #0366d6;">Download APK</a>
                <br><br>
                <p>Best Regards,<br>GitHub Actions CI/CD</p>
              \`,
            });

            console.log("✅ Email sent successfully:", info.messageId);
          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1);
          });
          EOF
    permissions:
      actions: read
      contents: read