name: Build and Send APK

on:
  push:
    branches: [dev]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Specific Node.js version for consistency

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Install Android Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk android-sdk

      - name: Set up Environment Variables
        run: |
          echo "JAVA_HOME=$(/usr/lib/jvm/java-17-openjdk-amd64)" >> $GITHUB_ENV
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/tools/bin" >> $GITHUB_PATH

      - name: Generate APK
        run: |
          # This is a placeholder. Replace with your actual APK generation commands.
          # For example, if you're using Gradle:
          ./gradlew assembleRelease
        working-directory: ./ # Replace with your project's root directory if needed

      - name: Find APK File
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          echo "::set-output name=apk_path::$APK_PATH"
        working-directory: ./ # Replace with your project's root directory if needed

      - name: Upload APK as Artifact (Debugging)
        uses: actions/upload-artifact@v3
        with:
          name: apk_debug
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Send Email with Brevo SMTP and APK Attachment
        env:
          BREVO_HOST: "smtp-relay.brevo.com"
          BREVO_PORT: 587
          BREVO_USERNAME: "86daf4001@smtp-brevo.com"
          BREVO_PASSWORD: "9HUFhqYPs4xgNJAc"
          RECIPIENT_EMAIL: "parthglory2025@gmail.com"  # For testing
          SENDER_EMAIL: "bhagyesh.glorywebsdev@gmail.com"  # Verified Sender in Brevo
          APK_PATH: ${{ steps.find_apk.outputs.apk_path }}
        run: |
          node <<EOF
          const nodemailer = require('nodemailer');
          const fs = require('fs');

          async function main() {
            const APK_PATH = process.env.APK_PATH;

            let transporter = nodemailer.createTransport({
              host: process.env.BREVO_HOST,
              port: process.env.BREVO_PORT,
              secure: false,
              auth: {
                user: process.env.BREVO_USERNAME,
                pass: process.env.BREVO_PASSWORD,
              },
              tls: {
                ciphers: 'SSLv3',
                rejectUnauthorized: false
              }
            });

            let info = await transporter.sendMail({
              from: \`"GitHub Actions" <\${process.env.SENDER_EMAIL}>\`,
              to: process.env.RECIPIENT_EMAIL,
              subject: "Your APK is Ready!",
              text: "Please find the attached APK file.",
              html: "<p>Please find the attached APK file.</p>",
              attachments: [{
                filename: 'app-release.apk',  // Consider making this dynamic
                path: APK_PATH,
                contentType: 'application/vnd.android.package-archive'
              }]
            });

            console.log("✅ Email sent: %s", info.messageId);
          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1);
          });
          EOF