name: Build and Send APK

on:
  push:
    branches: [dev]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Find APK Path
        id: find_apk
        run: echo "APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)" >> $GITHUB_ENV

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ${{ env.APK_PATH }}

      - name: Send Email with GitHub Artifact Link
        env:
          BREVO_HOST: "smtp-relay.brevo.com"
          BREVO_PORT: 587
          BREVO_USERNAME: "86daf4001@smtp-brevo.com"
          BREVO_PASSWORD: "9HUFhqYPs4xgNJAc"
          RECIPIENT_EMAIL: "parthglory2025@gmail.com"
          SENDER_EMAIL: "parthglory2025@gmail.com"
        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            const GITHUB_RUN_ID = process.env.GITHUB_RUN_ID;
            const REPO = process.env.GITHUB_REPOSITORY;
            const APK_LINK = \`https://github.com/\${REPO}/actions/runs/\${GITHUB_RUN_ID}\`;

            let transporter = nodemailer.createTransport({
              host: process.env.BREVO_HOST,
              port: process.env.BREVO_PORT,
              secure: false,
              auth: {
                user: process.env.BREVO_USERNAME,
                pass: process.env.BREVO_PASSWORD,
              },
              tls: {
                ciphers: 'SSLv3',
                rejectUnauthorized: false
              }
            });

            let info = await transporter.sendMail({
              from: \`"GitHub Actions" <\${process.env.SENDER_EMAIL}>\`,
              to: process.env.RECIPIENT_EMAIL,
              subject: "Your APK is Ready!",
              text: \`Download your APK here: \${APK_LINK}\`,
              html: \`<p>Your APK is ready! Click below to download:</p><a href="\${APK_LINK}">\${APK_LINK}</a>\`,
            });

            console.log("✅ Email sent: %s", info.messageId);
          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1);
          });
          EOF
