name: Build and Send Debug APK

on:
  push:
    branches: [dev]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Check Directory Structure
        run: ls -al

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Check APK File
        run: ls -al android/app/build/outputs/apk/debug

      - name: Upload Debug APK to AppHost
        id: upload_apk_to_apphost
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          echo "Uploading APK to AppHost..."

          RESPONSE=$(curl -s -F "file=@$APK_PATH" https://upload.appho.st)
          
          echo "AppHost Response: $RESPONSE"

          APPHOST_LINK=$(echo $RESPONSE | jq -r '.url')
          
          if [ "$APPHOST_LINK" == "null" ]; then
            echo "❌ Error uploading APK to AppHost!"
            exit 1
          fi
          
          echo "✅ APK uploaded! Link: $APPHOST_LINK"
          echo "APPHOST_LINK=$APPHOST_LINK" >> $GITHUB_ENV

      - name: Send Email with Brevo SMTP
        env:
          BREVO_HOST: "smtp-relay.brevo.com"
          BREVO_PORT: 587
          BREVO_USERNAME: ${{ secrets.BREVO_USERNAME }}
          BREVO_PASSWORD: ${{ secrets.BREVO_PASSWORD }}
          RECIPIENT_EMAIL: "parthglory2025@gmail.com"
          SENDER_EMAIL: "parthglory2025@gmail.com"

        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            const APK_LINK = process.env.APPHOST_LINK; 

            let transporter = nodemailer.createTransport({
              host: process.env.BREVO_HOST,
              port: process.env.BREVO_PORT,
              secure: false,
              auth: {
                user: process.env.BREVO_USERNAME,
                pass: process.env.BREVO_PASSWORD,
              },
              tls: {
                ciphers: 'SSLv3',
                rejectUnauthorized: false
              }
            });

            let info = await transporter.sendMail({
              from: \`"GitHub Actions" <\${process.env.SENDER_EMAIL}>\`,
              to: process.env.RECIPIENT_EMAIL,
              subject: "Your Debug APK is Ready!",
              text: \`Download your Debug APK here: \${APK_LINK}\`,
              html: \`<p>Your Debug APK is ready! Click below to download:</p><a href="\${APK_LINK}">\${APK_LINK}</a>\`,
            });

            console.log("✅ Email sent: %s", info.messageId);
          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1);
          });
          EOF
