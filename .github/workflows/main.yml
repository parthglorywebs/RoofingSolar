name: Send Test Email via SMTP

on:
  push:
    branches: [dev]

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Install Required Dependencies (Fix TLS)
        run: |
          sudo apt-get update
          sudo apt-get install -y sendemail libio-socket-ssl-perl libnet-ssleay-perl

      - name: Test DNS Resolution
        run: |
          nslookup smtp.gmail.com

      - name: Debug Email Sending
        run: |
          sendEmail -f "$MAIL_USERNAME" \
                    -t "Parthm@glorywebsdev.com" \
                    -s smtp.gmail.com:587 \
                    -xu "$MAIL_USERNAME" \
                    -xp "$MAIL_PASSWORD" \
                    -o tls=auto \
                    -u "Debug Test Email" \
                    -m "This is a debug test email!" \
                    -v -v -v  # Enable verbose mode
        shell: bash