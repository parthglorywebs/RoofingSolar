name: Build and Send APK

on:
  push:
    branches: [dev]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Build APK (Dummy example, replace with actual build process)
        run: |
          mkdir -p artifacts
          echo "This is a dummy APK file" > artifacts/app.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: artifacts/app.apk

      - name: Notify Users (Set Output)
        id: notify
        run: |
          echo "apk_ready=true" >> $GITHUB_OUTPUT
          echo "artifact_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: "Workflow Build and Send APK Job Result: ${{ job.status }}"
          to: vivek@glorywebs.com
          from: ${{ secrets.GMAIL_USERNAME }}
          secure: true
          body: |
            Hello,
            
            The workflow "${{ github.workflow }}" has completed.
            Job Status: ${{ job.status }}
            
            You can download the APK from the following link:
            ${{ steps.notify.outputs.artifact_url }}
          html_body: |
            <p>Hello,</p>
            <p>The workflow <b>${{ github.workflow }}</b> has completed.</p>
            <p>Job Status: <b>${{ job.status }}</b></p>
            <p>You can download the APK from the following link:</p>
            <a href="${{ steps.notify.outputs.artifact_url }}">Download APK</a>
