name: Send Test Email via SMTP (Node.js - Nodemailer)

on:
  push:
    branches: [dev]  # Trigger on pushes to the 'dev' branch

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' 

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Send Email with SMTP (Nodemailer)
        env:
          SMTP_HOST: smtp.gmail.com  # or your SMTP host
          SMTP_PORT: 465       # or your SMTP port (e.g., 587 for TLS)
          SMTP_USER: ${{ secrets.GMAIL_USER }}  # Your Gmail address
          SMTP_PASS: ${{ secrets.GMAIL_PASS }}  # Your Gmail App Password (very important!)
          EMAIL_FROM: ${{ secrets.SENDER_EMAIL }} # Sender's email address
          EMAIL_TO: ${{ secrets.SENDER_EMAIL }} # Recipient's email address (for testing)
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            // Create a transporter object using SMTP settings
            const transporter = nodemailer.createTransport({
              host: process.env.SMTP_HOST,
              port: process.env.SMTP_PORT,
              secure: true, // Use `true` for port 465, `false` for all other ports
              auth: {
                user: process.env.SMTP_USER,
                pass: process.env.SMTP_PASS,
              },
            });

            // Verify connection configuration
            transporter.verify(function(error, success) {
              if (error) {
                console.log(error);
              } else {
                console.log("Server is ready to take our messages");
              }
            });

            // Send the email
            const info = await transporter.sendMail({
              from: {
                name: process.env.SENDER_NAME,
                address: process.env.EMAIL_FROM
              }, // Sender address
              to: process.env.EMAIL_TO,  // Recipient address
              subject: "Test Email from GitHub Actions!",
              text: "This is a test email sent using Nodemailer and Gmail SMTP.",
              html: "<p>This is a <b>test email</b> sent using Nodemailer and Gmail SMTP.</p>",
            });

            console.log("Message sent: %s", info.messageId);
          }

          main().catch((error) => {
            console.error("Error sending email:", error);
          });
          EOF