name: Send Email with Mailjet

on:
  push:
    branches: [dev]

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install node-mailjet

      - name: Send Email
        env:
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_API_SECRET: ${{ secrets.MAILJET_API_SECRET }}
          RECIPIENT_EMAIL: "vivek@glorywebs.com"  # testing email address
          SENDER_EMAIL: "parthglory2025@gmail.com" # Must be a verified sender in Mailjet
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |
          node <<EOF
          const mailjet = require('node-mailjet').connect(
            process.env.MAILJET_API_KEY,
            process.env.MAILJET_API_SECRET
          );

          const GITHUB_RUN_ID = process.env.GITHUB_RUN_ID;
          const REPO = process.env.GITHUB_REPOSITORY;
          const APK_LINK = \`https://github.com/\${REPO}/actions/runs/\${GITHUB_RUN_ID}/artifacts\`;

          const request = mailjet.post('send', { version: 'v3.1' }).request({
            Messages: [
              {
                From: {
                  Email: process.env.SENDER_EMAIL,
                  Name: "GitHub Actions"
                },
                To: [
                  {
                    Email: process.env.RECIPIENT_EMAIL,
                    Name: "Recipient"
                  }
                ],
                Subject: "Your APK is Ready!",
                TextPart: \`Download your APK here: \${APK_LINK}\`,
                HTMLPart: \`<p>Your APK is ready! Click below to download:</p><a href="\${APK_LINK}">\${APK_LINK}</a>\`
              }
            ]
          });

          request
            .then((result) => {
              console.log("✅ Email sent:", result.body);
            })
            .catch((err) => {
              console.error("❌ Error sending email:", err.statusCode, err.message);
              process.exit(1);
            });
          EOF