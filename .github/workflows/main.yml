name: Build Android Debug APK and Send Email

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Install sendEmail
        run: |
          sudo apt-get update
          sudo apt-get install -y sendemail

      - name: Send Test Email
        run: |
          sendEmail -f "parthglory2025@gmail.com" \
                    -t "parthglory2025@gmail.com" \
                    -s smtp.gmail.com:587 \
                    -xu "${{ secrets.MAIL_USERNAME }}" \
                    -xp "${{ secrets.MAIL_PASSWORD }}" \
                    -o tls=yes \
                    -u "Test Email from GitHub Actions" \
                    -m "Hello, this is a test email sent from GitHub Actions!" \
                    -v  # Verbose mode for debugging
        shell: bash
