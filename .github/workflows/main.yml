name: Send Test Email via Sendinblue (Free Plan)

on:
  push:
    branches:
      - dev

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Send Email via Sendinblue
        env:
          SENDINBLUE_API_KEY: ${{ secrets.SENDINBLUE_API_KEY }}  # Store in GitHub Secrets
          TO_EMAIL: Parthm@glorywebsdev.com
          FROM_EMAIL: your_verified_email@example.com # IMPORTANT:  A verified "from" email in Sendinblue!
          SUBJECT: "GitHub Actions Test Email (Sendinblue Free)"
          BODY: "This is a test email sent from GitHub Actions via Sendinblue (free plan)!"
        run: |
          python -c "
          import requests
          import os

          url = 'https://api.sendinblue.com/v3/smtp/email'  # Corrected endpoint
          headers = {
              'accept': 'application/json',
              'content-type': 'application/json',
              'api-key': os.environ['SENDINBLUE_API_KEY']
          }
          data = {
              'sender': {'email': os.environ['FROM_EMAIL'], 'name': 'GitHub Actions'},
              'to': [{'email': os.environ['TO_EMAIL']}],
              'subject': os.environ['SUBJECT'],
              'htmlContent': f'<p>{os.environ['BODY']}</p>'  # Sendinblue wants HTML
          }
          response = requests.post(url, headers=headers, json=data)
          response.raise_for_status()
          print(f'Email sent! Status code: {response.status_code}, Response: {response.text}')
          "