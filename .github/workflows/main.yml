name: Send Test Email via Mailjet SMTP

on:
  push:
    branches: [dev]  # Runs when pushing to the 'dev' branch

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install msmtp (SMTP client)
        run: sudo apt-get install -y msmtp msmtp-mta

      - name: Configure msmtp
        run: |
          echo "account mailjet" > ~/.msmtprc
          echo "host in-v3.mailjet.com" >> ~/.msmtprc
          echo "port 587" >> ~/.msmtprc
          echo "auth on" >> ~/.msmtprc
          echo "tls on" >> ~/.msmtprc
          echo "tls_trust_file /etc/ssl/certs/ca-certificates.crt" >> ~/.msmtprc
          echo "user $SMTP_USERNAME" >> ~/.msmtprc
          echo "password $SMTP_PASSWORD" >> ~/.msmtprc
          echo "from parthm@glorywebsdev.com" >> ~/.msmtprc
          echo "account default: mailjet" >> ~/.msmtprc
          chmod 600 ~/.msmtprc

      - name: Send Email via SMTP
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo -e "Subject: Test Email via Mailjet SMTP\nFrom: parthm@glorywebsdev.com\nTo: parthglory2025@gmail.com\n\nHello Parth, this is a test email sent via Mailjet SMTP!" | msmtp --debug --from=mailjet -t parthglory2025@gmail.com
