name: Send Test Email to Parthm

on:
  push:
    branches:
      - dev  # Trigger on pushes to the 'main' branch

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'  # Or your Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Send Email via SendGrid
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}  # Store in GitHub Secrets
          TO_EMAIL: Parthm@glorywebsdev.com  # Your email address
          FROM_EMAIL: your_app@example.com  # IMPORTANT: Replace with a verified "from" email in your SendGrid account!
          SUBJECT: "GitHub Actions Test Email (To Parthm)"
          BODY: "This is a test email sent from GitHub Actions to Parthm@glorywebsdev.com!"
        run: |
          python -c "
          import requests
          import os

          url = 'https://api.sendgrid.com/v3/mail/send'
          headers = {
              'Authorization': f'Bearer {os.environ['SENDGRID_API_KEY']}',
              'Content-Type': 'application/json'
          }
          data = {
              'personalizations': [{
                  'to': [{'email': os.environ['TO_EMAIL']}]
              }],
              'from': {'email': os.environ['FROM_EMAIL']},
              'subject': os.environ['SUBJECT'],
              'content': [{'type': 'text/plain', 'value': os.environ['BODY']}]
          }

          response = requests.post(url, headers=headers, json=data)
          response.raise_for_status()  # Raise exception for bad status codes
          print(f'Email sent! Status code: {response.status_code}')
          "