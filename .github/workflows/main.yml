name: Send Test Email via Mailjet API

on:
  push:
    branches: [dev]

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Mailjet SDK
        run: pip install mailjet_rest

      - name: Send Email with Mailjet API
        env:
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}  # Your Mailjet API key
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}  # Your Mailjet Secret key
        run: |
          python <<EOF
          from mailjet_rest import Client
          import os

          api_key = os.environ.get('MAILJET_API_KEY')
          api_secret = os.environ.get('MAILJET_SECRET_KEY')

          mailjet = Client(auth=(api_key, api_secret), version='v3.1')
          data = {
            'Messages': [
              {
                "From": {
                  "Email": "your_sender@example.com",
                  "Name": "Parth Glory"
                },
                "To": [
                  {
                    "Email": "parthglory2025@gmail.com",
                    "Name": "Parth Glory"
                  }
                ],
                "Subject": "Greetings from Mailjet.",
                "TextPart": "My first Mailjet email",
                "HTMLPart": "<h3>Dear Parth Glory, welcome to Mailjet!</h3><br />May the delivery force be with you!",
                "CustomID": "AppGettingStartedTest"
              }
            ]
          }
          try:
              result = mailjet.post(path='send', data=data)
              print(result.status_code)
              print(result.json())
          except Exception as e:
              print(f"Error sending email: {e}")
          EOF