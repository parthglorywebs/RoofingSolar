name: Send Test Email via Gmail SMTP (Node.js)

on:
  push:
    branches: [dev]  # Trigger on pushes to the 'dev' branch

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Specific Node.js version for consistency

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Send Email with Gmail SMTP
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }} # Gmail address to send from
          GMAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }} # App Password for Gmail (highly recommended!)
        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            let transporter = nodemailer.createTransport({
              host: "smtp.gmail.com",
              port: 465, // or 587 for TLS
              secure: true, // true for 465, false for other ports
              auth: {
                user: process.env.GMAIL_USER,
                pass: process.env.GMAIL_PASS, // Use an App Password!
              },
            });

            let info = await transporter.sendMail({
              from: '"GitHub Actions" <${process.env.GMAIL_USER}>', // sender address
              to: "parthglory2025@gmail.com", // list of receivers (can be multiple)
              subject: "Greetings from GitHub Actions (Gmail SMTP)!", // Subject line
              text: "Dear Parth Glory, this is a test email sent via Gmail SMTP from GitHub Actions!", // plain text body
              html: "<h3>Dear Parth Glory, this is a test email sent via Gmail SMTP from GitHub Actions!</h3><br />", // html body
            });

            console.log("✅ Message sent: %s", info.messageId);
            console.log("Preview URL: %s", nodemailer.getTestMessageUrl(info)); // Only for Ethereal accounts

          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1); // Fail the workflow if email sending fails
          });
          EOF