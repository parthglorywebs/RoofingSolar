name: Send Email with Node.js and Zoho Mail

on:
  push:
    branches: [main]  # Change to your trigger branch

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Or your desired Node.js version

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Send Email with Zoho Mail
        env:
          ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          ZOHO_APP_PASSWORD: ${{ secrets.ZOHO_APP_PASSWORD }}
          GITHUB_OUTPUT: ${{ github.output }}
        run: |
          echo "RUNNER_DEBUG=1" >> $GITHUB_ENV
          node <<EOF
          const nodemailer = require('nodemailer');
          const fs = require('fs');

          async function sendEmail() {
            try {
              // Create a transporter object using Zoho Mail SMTP settings
              let transporter = nodemailer.createTransport({
                host: 'smtp.zoho.com',  // Zoho SMTP server
                port: 587,               // Or 465 for SSL
                secure: false,           // True for 465, false for 587
                auth: {
                  user: process.env.ZOHO_EMAIL,   // Your Zoho Mail email address (from environment variable)
                  pass: process.env.ZOHO_APP_PASSWORD  // Your app password (from environment variable)
                },
                tls: {
                   ciphers: 'SSLv3',
                   rejectUnauthorized: false // Only if needed
                }
              });

              // Define the email message
              let mailOptions = {
                from: '"GitHub Actions Test" <' + process.env.ZOHO_EMAIL + '>', // Sender address
                to: 'recipient@example.com',          // Recipient address
                subject: 'Test Email from Node.js and GitHub Actions',
                text: 'This is a test email sent from a Node.js script in GitHub Actions!',
                html: '<p>This is a <b>test</b> email sent from a Node.js script in GitHub Actions!</p>'
              };

              // Send the email
              let info = await transporter.sendMail(mailOptions);

              console.log('✅ Email sent: %s', info.messageId);
              fs.writeFileSync(process.env.GITHUB_OUTPUT, 'email_sent=true\n', { flag: 'a' });
            } catch (error) {
              console.error('❌ Error sending email: ', error);
              fs.writeFileSync(process.env.GITHUB_OUTPUT, 'email_sent=false\n', { flag: 'a' });
            }
          }

          sendEmail();
          EOF
        id: send_mail_step

      - name: Output Result
        run: |
           echo "Mail Sent: ${{ steps.send_mail_step.outputs.email_sent }}"