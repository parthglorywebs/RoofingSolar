name: Build and Send APK with Google Drive Link

on:
  push:
    branches: [dev]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Specific Node.js version for consistency

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Install Android Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk android-sdk

      - name: Set up Environment Variables
        run: |
          echo "JAVA_HOME=$(/usr/lib/jvm/java-17-openjdk-amd64)" >> $GITHUB_ENV
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/tools/bin" >> $GITHUB_PATH

      - name: Generate APK
        run: |
          # Replace with your actual APK generation commands (e.g., ./gradlew assembleRelease)
          ./gradlew assembleRelease
        working-directory: ./ # Replace with your project's root directory if needed

      - name: Find APK File
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          echo "::set-output name=apk_path::$APK_PATH"
        working-directory: ./ # Replace with your project's root directory if needed

      - name: Upload APK to Google Drive
        id: upload_to_drive
        uses: oleg-koval/google-drive-upload@v2
        with:
          folderId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }} # Use the credential secret
          parentId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          name: app-release.apk # You can customize the name

      - name: Get Google Drive Link
        id: get_drive_link
        run: |
          # The action doesn't directly expose the shareable link.  You will need to write code to grab it.
          # This example assumes that the google-drive-upload action outputs the file ID
          FILE_ID=$(echo ${{ steps.upload_to_drive.outputs.ids }} | jq -r '.[0]')
          echo "FILE_ID=$FILE_ID" >> $GITHUB_ENV
          # Generate a shareable Google Drive link.  This requires a separate API call, which can be complex.
          # For a simplified approach, consider using the file ID directly or instruct users to locate the file
          # in the shared folder. This simplified example returns the Google Drive file link.
          DRIVE_LINK="https://drive.google.com/file/d/$FILE_ID/view?usp=sharing"
          echo "DRIVE_LINK=$DRIVE_LINK" >> $GITHUB_ENV
          echo "::set-output name=drive_link::$DRIVE_LINK"

      - name: Send Email with Brevo SMTP and Google Drive Link
        env:
          BREVO_HOST: "smtp-relay.brevo.com"
          BREVO_PORT: 587
          BREVO_USERNAME: "86daf4001@smtp-brevo.com"
          BREVO_PASSWORD: "9HUFhqYPs4xgNJAc"
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}  # Get from secrets
          SENDER_EMAIL: "parthglory2025@gmail.com"  # Verified Sender in Brevo
          DRIVE_LINK: ${{ env.DRIVE_LINK }}
        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            let transporter = nodemailer.createTransport({
              host: process.env.BREVO_HOST,
              port: process.env.BREVO_PORT,
              secure: false,
              auth: {
                user: process.env.BREVO_USERNAME,
                pass: process.env.BREVO_PASSWORD,
              },
              tls: {
                ciphers: 'SSLv3',
                rejectUnauthorized: false
              }
            });

            let info = await transporter.sendMail({
              from: \`"GitHub Actions" <\${process.env.SENDER_EMAIL}>\`,
              to: process.env.RECIPIENT_EMAIL,
              subject: "Your APK is Ready!",
              text: \`Download your APK here: \${process.env.DRIVE_LINK}\`,
              html: \`<p>Your APK is ready! Click below to download:</p><a href="\${process.env.DRIVE_LINK}">Download APK</a>\`,
            });

            console.log("✅ Email sent: %s", info.messageId);
          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1);
          });
          EOF