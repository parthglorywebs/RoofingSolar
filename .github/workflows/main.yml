name: Build and Send APK

on:
  push:
    branches: [dev]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Specific Node.js version for consistency

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Send Email with Gmail SMTP (App Password Required)
        env:
          GMAIL_HOST: "smtp.gmail.com"
          GMAIL_PORT: 465  # Use 465 for SSL
          GMAIL_USERNAME: "your_gmail_address@gmail.com"  # Replace with your Gmail address
          GMAIL_PASSWORD: "your_gmail_app_password"  #  REPLACE WITH YOUR APP PASSWORD!  Important!
          RECIPIENT_EMAIL: "parthglory2025@gmail.com"  # For testing
          SENDER_EMAIL: "your_gmail_address@gmail.com"  # Should be the same as GMAIL_USERNAME
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}

        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            const GITHUB_RUN_ID = process.env.GITHUB_RUN_ID;
            const REPO = process.env.GITHUB_REPOSITORY;
            const APK_LINK = \`https://github.com/\${REPO}/actions/runs/\${GITHUB_RUN_ID}/artifacts\`;

            let transporter = nodemailer.createTransport({
              host: process.env.GMAIL_HOST,
              port: process.env.GMAIL_PORT,
              secure: true,  // Use SSL
              auth: {
                user: process.env.GMAIL_USERNAME,
                pass: process.env.GMAIL_PASSWORD,
              },
            });

            let info = await transporter.sendMail({
              from: \`"GitHub Actions" <\${process.env.SENDER_EMAIL}>\`,
              to: process.env.RECIPIENT_EMAIL,
              subject: "Your APK is Ready!",
              text: \`Download your APK here: \${APK_LINK}\`,
              html: \`<p>Your APK is ready! Click below to download:</p><a href="\${APK_LINK}">\${APK_LINK}</a>\`,
            });

            console.log("✅ Email sent: %s", info.messageId);
          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1);
          });
          EOF