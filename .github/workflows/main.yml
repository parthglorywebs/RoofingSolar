name: Send Test Email via SMTP

on:
  push:
    branches: [dev]

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Send Email Notification
        uses: hilarion5/send-mail@v1
        with:
          smtp-server: smtp.gmail.com
          smtp-port: 587
          smtp-secure: true
          from-email: ${{ secrets.MAIL_USERNAME }}
          to-email: Parthm@glorywebsdev.com
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Test Email from GitHub Actions 🚀"
          body: "Hello Parth, this is a test email sent from GitHub Actions!"
          html: |
            <h1>Hello Parth 👋</h1>
            <p>This is a test email sent from <strong>GitHub Actions</strong>.</p>
            <p><b>SMTP Email Sending is Working ✅</b></p>
