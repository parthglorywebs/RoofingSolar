name: Build and Send APK

on:
  push:
    branches: [dev]

jobs:
  build_and_upload_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Specific Node.js version for consistency

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Build APK (Debug) # or assembleRelease for production
        id: build_apk
        run: |
          # Make sure gradlew is executable
          chmod +x gradlew

          # Assuming you're using Gradle. Adjust command as needed.
          ./gradlew assembleDebug # or assembleRelease

          # Check if the APK was created
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
            echo "::set-output name=apk_built::true" # Set output variable
          else
            echo "❌ APK not found! Build failed or path is incorrect."
            exit 1  # Exit the step, indicating failure
          fi
        shell: /usr/bin/bash -e {0}

      - name: Upload APK to App Center
        if: steps.build_apk.outputs.apk_built == 'true'
        env:
          APP_CENTER_TOKEN: ${{ secrets.APP_CENTER_TOKEN }}
          APK_PATH: ${{ env.APK_PATH }}
          APP_CENTER_OWNER_NAME: "YourAppCenterOwnerName"  # Replace with your App Center owner name
          APP_CENTER_APP_NAME: "YourAppCenterAppName"  # Replace with your App Center app name
          RELEASE_NOTES: "Automatically built and deployed from GitHub Actions."
        run: |
          # Install App Center CLI
          sudo npm install -g appcenter-cli

          # Configure App Center CLI
          appcenter login --token $APP_CENTER_TOKEN

          # Upload the APK
          appcenter distribute release --app "${APP_CENTER_OWNER_NAME}/${APP_CENTER_APP_NAME}" --file "$APK_PATH" --release-notes "$RELEASE_NOTES"

          # Get the release ID
          RELEASE_ID=$(appcenter distribute releases list --app "${APP_CENTER_OWNER_NAME}/${APP_CENTER_APP_NAME}" | jq -r '.[0].id')
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV

          # Create a distribution group
          DISTRIBUTION_GROUP="Collaborators" # Change if necessary

          # Add the release to the distribution group
          appcenter distribute releases add-groups --app "${APP_CENTER_OWNER_NAME}/${APP_CENTER_APP_NAME}" --id $RELEASE_ID --groups "$DISTRIBUTION_GROUP"

          # Construct the App Center install link (this is just an example, may need adjusting)
          INSTALL_LINK="https://install.appcenter.ms/${APP_CENTER_OWNER_NAME}/${APP_CENTER_APP_NAME}"
          echo "INSTALL_LINK=$INSTALL_LINK" >> $GITHUB_ENV

          echo "✅ APK uploaded to App Center!"
        shell: /usr/bin/bash -e {0}

  send_email:
    needs: build_and_upload_apk
    if: always() # Ensures email is sent regardless of prior step success/failure
    runs-on: ubuntu-latest
    env:
      BREVO_HOST: "smtp-relay.brevo.com"
      BREVO_PORT: 587
      BREVO_USERNAME: "86daf4001@smtp-brevo.com"
      BREVO_PASSWORD: "9HUFhqYPs4xgNJAc"
      RECIPIENT_EMAIL: "vivek@glorywebs.com"  # For testing
      SENDER_EMAIL: "parthglory2025@gmail.com"  # Verified Sender in Brevo
    steps:
      - name: Send Email with Brevo SMTP
        run: |
          INSTALL_LINK="${{ env.INSTALL_LINK }}"
          NODE_OPTIONS="--tls-min-v1.1" node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            const installLink = process.env.INSTALL_LINK || "No link available (build or upload failed)"; // Use link, or fallback
            const success = process.env.INSTALL_LINK ? true : false;

            let transporter = nodemailer.createTransport({
              host: process.env.BREVO_HOST,
              port: process.env.BREVO_PORT,
              secure: false,
              auth: {
                user: process.env.BREVO_USERNAME,
                pass: process.env.BREVO_PASSWORD,
              },
              tls: {
                ciphers: 'SSLv3',
                rejectUnauthorized: false
              }
            });

            let info = await transporter.sendMail({
              from: "GitHub Actions <${process.env.SENDER_EMAIL}>",
              to: process.env.RECIPIENT_EMAIL,
              subject: success ? "Your APK is Ready!" : "APK Build/Upload Failed",
              text: success ? `Download your APK here: ${installLink}` : "APK build or upload to App Center failed. Check the workflow logs for details.",
              html: success ? `<p>Your APK is ready! Click below to download:</p><a href="${installLink}">${installLink}</a>` : "<p>APK build or upload to App Center failed. Check the workflow logs for details.</p>",
            });

            console.log("✅ Email sent: %s", info.messageId);
          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1);
          });
          EOF