name: Build Android Debug APK

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache Android SDK
      uses: actions/cache@v3
      with:
        path: ~/android/sdk
        key: ${{ runner.os }}-android-sdk
        restore-keys: ${{ runner.os }}-android-sdk

    - name: Install dependencies
      run: |
        npm install
        cd android

    - name: Assemble Debug
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Get Workflow Run URL
      id: workflow_run_url
      uses: actions/github-script@v7
      with:
        script: |
          const runId = context.runId;
          const repo = context.repo.owner + "/" + context.repo.repo;
          const runURL = `https://github.com/${repo}/actions/runs/${runId}`;
          core.setOutput('run_url', runURL);

    - name: Send Email with Workflow Run URL
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }} # Still needed for sending email
        password: ${{ secrets.MAIL_PASSWORD }} # Still needed for sending email
        subject: "New Android Debug APK Build Available"
        to: parthglory2025@gmail.com
        from: ${{ secrets.MAIL_USERNAME }}
        body: |
          A new Android Debug APK build is available for testing.

          Please follow these steps to download the APK:

          1. Click on the link below to go to the GitHub Actions workflow run page:
             https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          2. Scroll down to the "Artifacts" section at the bottom of the page.
          3. Click on "app-debug.apk" to download the APK file.

        secure: true