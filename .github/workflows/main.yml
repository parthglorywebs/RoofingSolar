name: Build Android Debug APK and Send Email

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: Cache Gradle Dependencies
      uses: actions/cache@v3
      with:
        path: ~/.gradle/caches
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/*.kt', '**/*.java') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Cache Node Modules
      uses: actions/cache@v3
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: node-modules-${{ runner.os }}-

    - name: Install dependencies
      run: |
        npm install
        cd android
        ./gradlew clean

    - name: Assemble Debug APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Get Workflow Run URL
      run: echo "RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV

    - name: Send Email with APK Link
      uses: dawidd6/action-send-mail@v3 
      with:
        server_address: smtp.gmail.com 
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }} 
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "✅ Debug APK Build Available"
        to: ${{ secrets.MAIL_USERNAME }}
        from: ${{ secrets.MAIL_USERNAME }}
        body: |
          🎉 A new debug APK build is available for testing!

          🔗 **Download APK**: [GitHub Artifacts](${{ env.RUN_URL }})
          
          📅 Build Time: $(date)

          Regards,  
          🚀 GitHub Actions CI/CD
        secure: true
