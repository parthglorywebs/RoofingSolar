name: Debug APK Link

on:
  push:
    branches: [dev]

jobs:
  debug_link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build APK
        run: |
          echo "Building APK..."
          mkdir -p app/build/outputs/apk/debug
          touch app/build/outputs/apk/debug/app-debug.apk  # Replace with your actual build commands

      - name: Upload APK (If Using Hosting Service)
        run: |
          # Replace with actual upload command to your preferred hosting service
          # For example, if you're using a service that allows curl uploads:
          # curl -F "file=@app/build/outputs/apk/debug/app-debug.apk" https://example.com/upload
          echo "Uploading APK to hosting service..."
          # Add your curl command here
          #  and set APK_URL
          APK_URL="YOUR_MANUALLY_VERIFIED_LINK" # Test with manually created link from point #1
          echo "APK_URL=$APK_URL" >> $GITHUB_ENV

      - name: Print the APK URL
        run: |
          echo "The APK URL is: ${{ env.APK_URL }}"