name: Send Test Email via Mailjet API (Node.js)

on:
  push:
    branches: [dev]  # Trigger on pushes to the 'dev' branch (adjust as needed)

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'  # Use a specific Node.js version

      - name: Install Dependencies
        run: npm install node-mailjet  # Install the Mailjet Node.js library

      - name: Send Email with Mailjet API (Sandbox Mode)
        env:
          MJ_APIKEY_PUBLIC: ${{ secrets.MAILJET_API_KEY }}
          MJ_APIKEY_PRIVATE: ${{ secrets.MAILJET_SECRET_KEY }}
        run: |
          node <<EOF
          const Mailjet = require('node-mailjet');

          const mailjet = Mailjet.apiConnect(
            process.env.MJ_APIKEY_PUBLIC,
            process.env.MJ_APIKEY_PRIVATE,
          );

          const request = mailjet
            .post('send', { version: 'v3.1' })
            .request({
              SandboxMode: true,  // Enable Mailjet's test mode
              Messages: [
                {
                  From: {
                    Email: "parthm@glorywebsdev.com",
                    Name: "Parth Glory"
                  },
                  To: [
                    {
                      Email: "parthglory2025@gmail.com",
                      Name: "Parth Glory"
                    }
                  ],
                  Subject: "Test Email (Sandbox Mode)",
                  TextPart: "This is a test email in sandbox mode.",
                  HTMLPart: "<h3>This is a test email in sandbox mode.</h3>"
                }
              ]
            });

          request
            .then((result) => {
              console.log("Sandbox test email sent successfully!");
              console.log(result.body);  // Log the response body
            })
            .catch((err) => {
              console.error("Error sending email in sandbox mode:");
              console.error(err.statusCode); // Log the status code
              console.error(err);            // Log the complete error message
            });
          EOF