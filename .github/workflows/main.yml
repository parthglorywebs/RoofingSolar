name: Build and Send APK

on:
  push:
    branches: [dev]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Upload APK to Diawi
        id: upload_apk_to_diawi
        env:
          DIAWI_TOKEN: ${{ secrets.DIAWI_TOKEN }} # Store your Diawi API token as a GitHub secret
        run: |
          APK_PATH="path/to/your/app.apk" # Replace with your actual APK path
          echo "Uploading APK to Diawi..."
          RESPONSE=$(curl -s -F token=$DIAWI_TOKEN -F file=@$APK_PATH -F "wall_of_apps=0" -F "password=" -F "comment=Generated by GitHub Actions" https://upload.diawi.com/)
          DIAWI_LINK="https://diawi.com/$(echo $RESPONSE | jq -r '.hash')"
          echo "APK uploaded! Link: $DIAWI_LINK"
          echo "DIAWI_LINK=$DIAWI_LINK" >> $GITHUB_ENV

      - name: Send Email with Brevo SMTP
        env:
          BREVO_HOST: "smtp-relay.brevo.com"
          BREVO_PORT: 587
          BREVO_USERNAME: ${{ secrets.BREVO_USERNAME }}
          BREVO_PASSWORD: ${{ secrets.BREVO_PASSWORD }}
          RECIPIENT_EMAIL: "parthglory2025@gmail.com"
          SENDER_EMAIL: "parthglory2025@gmail.com"

        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            const APK_LINK = process.env.DIAWI_LINK; 

            let transporter = nodemailer.createTransport({
              host: process.env.BREVO_HOST,
              port: process.env.BREVO_PORT,
              secure: false,
              auth: {
                user: process.env.BREVO_USERNAME,
                pass: process.env.BREVO_PASSWORD,
              },
              tls: {
                ciphers: 'SSLv3',
                rejectUnauthorized: false
              }
            });

            let info = await transporter.sendMail({
              from: \`"GitHub Actions" <\${process.env.SENDER_EMAIL}>\`,
              to: process.env.RECIPIENT_EMAIL,
              subject: "Your APK is Ready!",
              text: \`Download your APK here: \${APK_LINK}\`,
              html: \`<p>Your APK is ready! Click below to download:</p><a href="\${APK_LINK}">\${APK_LINK}</a>\`,
            });

            console.log("✅ Email sent: %s", info.messageId);
          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1);
          });
          EOF
