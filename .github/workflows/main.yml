name: Build and Send APK

on:
  push:
    branches: [dev]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Specific Node.js version for consistency

      - name: Install Dependencies
        run: npm install nodemailer

      # Placeholder for building the APK.  Replace with your actual build steps.
      - name: Build APK
        run: |
          echo "Building APK..."
          mkdir -p app/build/outputs/apk/debug
          touch app/build/outputs/apk/debug/app-debug.apk  # Create a dummy apk for testing. REMOVE THIS when you have a real APK build process.
          echo "APK built at app/build/outputs/apk/debug/app-debug.apk"

      # Step to upload the APK to a temporary location. Replace with your actual path
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Upload APK to Transfer.sh (free, temporary file hosting)
      - name: Upload APK to Transfer.sh
        run: |
          APK_PATH=app/build/outputs/apk/debug/app-debug.apk  # Replace with your actual APK path.
          APK_FILENAME=$(basename "$APK_PATH") # Extract filename
          if [ -f "$APK_PATH" ]; then
            APK_URL=$(curl --upload-file "$APK_PATH" "https://transfer.sh/$APK_FILENAME" | tee output.txt)
            echo "APK_URL=$APK_URL" >> $GITHUB_ENV
          else
            echo "APK not found at $APK_PATH"
            exit 1
          fi

      - name: Send Email with Brevo SMTP
        env:
          BREVO_HOST: "smtp-relay.brevo.com"
          BREVO_PORT: 587
          BREVO_USERNAME: "86daf4001@smtp-brevo.com"
          BREVO_PASSWORD: "9HUFhqYPs4xgNJAc"
          RECIPIENT_EMAIL: "parthglory2025@gmail.com"  # For testing
          SENDER_EMAIL: "parthglory2025@gmail.com"  # Verified Sender in Brevo
          APK_URL: ${{ env.APK_URL }}

        run: |
          node <<EOF
          const nodemailer = require('nodemailer');

          async function main() {
            const APK_LINK = process.env.APK_URL;

            let transporter = nodemailer.createTransport({
              host: process.env.BREVO_HOST,
              port: process.env.BREVO_PORT,
              secure: false,
              auth: {
                user: process.env.BREVO_USERNAME,
                pass: process.env.BREVO_PASSWORD,
              },
              tls: {
                ciphers: 'SSLv3',
                rejectUnauthorized: false
              }
            });

            let info = await transporter.sendMail({
              from: \`"GitHub Actions" <\${process.env.SENDER_EMAIL}>\`,
              to: process.env.RECIPIENT_EMAIL,
              subject: "Your APK is Ready!",
              text: \`Download your APK here: \${APK_LINK}\`,
              html: \`<p>Your APK is ready! Click below to download:</p><a href="\${APK_LINK}">Download APK</a>\`,
            });

            console.log("✅ Email sent: %s", info.messageId);
          }

          main().catch((error) => {
            console.error("❌ Error sending email:", error);
            process.exit(1);
          });
          EOF