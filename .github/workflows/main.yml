name: Send Test Email via Mailjet API

on:
  push:
    branches: [dev]

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Mailjet SDK
        run: pip install mailjet_rest requests

      - name: Send Email with Mailjet API
        env:
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}  
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}  
        run: |
          python <<EOF
          from mailjet_rest import Client
          import os

          api_key = os.getenv('MAILJET_API_KEY')
          api_secret = os.getenv('MAILJET_SECRET_KEY')

          if not api_key or not api_secret:
              print("Error: API Key or Secret is missing!")
              exit(1)

          mailjet = Client(auth=(api_key, api_secret), version='v3.1')
          data = {
            'Messages': [
              {
                "From": {
                  "Email": "parthm@glorywebsdev.com",
                  "Name": "Parth Glory"
                },
                "To": [
                  {
                    "Email": "parthglory2025@gmail.com",
                    "Name": "Parth Glory"
                  }
                ],
                "Subject": "Greetings from Mailjet.",
                "TextPart": "My first Mailjet email",
                "HTMLPart": "<h3>Dear Parth Glory, welcome to Mailjet!</h3><br />May the delivery force be with you!",
                "CustomID": "AppGettingStartedTest"
              }
            ]
          }
          
          try:
              response = mailjet.post("send", data=data)
              print(f"Status Code: {response.status_code}")
              print(f"Response: {response.json()}")
              
              if response.status_code != 200:
                  print("Error: Failed to send email.")
                  exit(1)
          except Exception as e:
              print(f"Error sending email: {e}")
              exit(1)
          EOF
